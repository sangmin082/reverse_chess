name: iOS

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  # 서명 없이 컴파일 검증 (Apple Developer 계정 불필요)
  # TestFlight 업로드는 .github/workflows/testflight.yml (fastlane) 사용
  build:
    name: Build (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project ReverseChess.xcodeproj \
            -scheme ReverseChess \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
